<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静音挑战 · 控班助手</title>
  
  <!-- 引入优质字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;900&family=Noto+Sans+SC:wght@500;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-forest: #090d16;
      --primary: #38bdf8;
      --text: #f1f5f9;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans SC', system-ui, sans-serif;
      background: var(--bg-forest);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    /* 星空背景 */
    .forest-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, #17172b 0%, #05050b 80%);
      z-index: 1;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.3;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .star.glow {
      opacity: 1;
      box-shadow: 0 0 8px #fff, 0 0 15px #fef08a;
      background: #fef08a;
      transform: scale(1.5);
    }

    /* 游戏大卡片 */
    .game-card {
      position: relative;
      z-index: 10;
      background: rgba(15, 23, 42, 0.75);
      border: 2px solid rgba(56, 189, 248, 0.15);
      border-radius: 36px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      transition: var(--transition);
    }

    /* 版本切换器 */
    .mode-selector {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: 100%;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 15px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 800;
      color: #94a3b8;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: var(--transition);
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      color: white;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    }

    /* 熊猫舞台 */
    .panda-stage {
      width: 100%;
      height: 240px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .panda-svg {
      width: 220px;
      height: 220px;
      transition: var(--transition);
    }

    .panda-ear {
      transition: transform 0.1s ease;
      transform-origin: center bottom;
    }
    .panda-ear-left { transform-origin: 65px 75px; }
    .panda-ear-right { transform-origin: 155px 75px; }

    .shake-ears {
      animation: shakeEar 0.15s infinite alternate;
    }

    @keyframes shakeEar {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }

    .panda-eye-sleep { transition: opacity 0.2s ease; opacity: 1; }
    .panda-eye-awake { transition: opacity 0.2s ease; opacity: 0; }

    .panda-hand {
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .panda-hand-left { transform-origin: 60px 170px; }
    .panda-hand-right { transform-origin: 160px 170px; }

    .cover-ears-left { transform: translate(15px, -35px) rotate(45deg); }
    .cover-ears-right { transform: translate(-15px, -35px) rotate(-45deg); }

    /* 极简数值舞台 (三年级版) */
    .classic-stage {
      width: 100%;
      height: 240px;
      position: relative;
      display: none; /* 默认隐藏，切换时显示 */
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    /* 霓虹发光圆环 */
    .glowing-ring {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 4px solid var(--success);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.2), inset 0 0 20px rgba(16, 185, 129, 0.2);
      transition: transform 0.1s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .ring-val {
      font-family: 'Share Tech Mono', monospace;
      font-size: 3.5rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .ring-lbl {
      font-size: 0.75rem;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Zzz 睡眠气泡 */
    .zzz-bubble {
      position: absolute;
      color: #7dd3fc;
      font-weight: 900;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.2rem;
      pointer-events: none;
      animation: floatZzz 3s linear forwards;
      opacity: 0;
      text-shadow: 0 0 5px rgba(56, 189, 248, 0.5);
    }

    @keyframes floatZzz {
      0% { transform: translate(10px, -20px) scale(0.6); opacity: 0; }
      20% { opacity: 0.8; }
      50% { transform: translate(-15px, -70px) scale(1); }
      80% { opacity: 0.8; }
      100% { transform: translate(20px, -150px) scale(1.3); opacity: 0; }
    }

    /* 星星回投动效 */
    .floating-star-feedback {
      position: absolute;
      font-size: 1.5rem;
      color: #fef08a;
      pointer-events: none;
      z-index: 100;
      animation: floatStarToBank 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes floatStarToBank {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0.5); opacity: 0.2; }
    }

    /* 吵闹扣分飘浮负数反馈 */
    .minus-points-feedback {
      position: absolute;
      font-size: 1.8rem;
      font-family: 'Share Tech Mono', monospace;
      font-weight: 900;
      color: var(--error);
      pointer-events: none;
      z-index: 101;
      animation: floatMinusPoints 1.2s ease-out forwards;
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }

    @keyframes floatMinusPoints {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-80px); opacity: 0; }
    }

    /* 状态提示语 */
    .status-banner {
      font-size: 1.15rem;
      font-weight: 900;
      padding: 6px 20px;
      border-radius: 50px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: var(--transition);
      width: 100%;
    }

    /* 积分看板 */
    .score-bank {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 24px;
      padding: 15px 30px;
      width: 100%;
      border: 1.5px solid rgba(56, 189, 248, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .bank-label {
      font-size: 0.9rem;
      color: #94a3b8;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bank-value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 2.8rem;
      font-weight: 900;
      color: #fef08a;
      text-shadow: 0 0 15px rgba(254, 240, 138, 0.3);
      line-height: 1;
    }

    /* 声音进度条 */
    .noise-container {
      width: 100%;
      text-align: left;
    }

    .bar-label {
      font-size: 0.8rem;
      font-weight: 800;
      color: #64748b;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .noise-meter {
      width: 100%;
      height: 18px;
      background: #111827;
      border-radius: 50px;
      overflow: hidden;
      border: 1.5px solid #1e293b;
    }

    .noise-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      transition: width 0.1s ease;
    }

    /* 灵敏度控制 */
    .settings-panel {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 18px;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 800;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      outline: none;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* 控制按钮 */
    .action-row {
      display: flex;
      gap: 15px;
      width: 100%;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      border: none;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-play {
      flex: 1;
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    .btn-play:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
    }

    .btn-stop {
      flex: 1;
      background: #334155;
      color: white;
    }

    .btn-reset {
      background: transparent;
      border: 2px solid #334155;
      color: #64748b;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .btn-reset:hover {
      border-color: var(--error);
      color: var(--error);
    }

    .tip {
      font-size: 0.75rem;
      color: #475569;
      font-weight: 700;
    }
  </style>
</head>
<body>

<!-- 星空背景 -->
<div class="forest-bg" id="sky"></div>

<!-- 主卡片 -->
<div class="game-card" id="card">

  <!-- 版本选择开关 -->
  <div class="mode-selector">
    <button class="mode-btn active" id="btn-mode-panda" onclick="setMode('panda')">🐻 熊猫美梦 (一年级)</button>
    <button class="mode-btn" id="btn-mode-classic" onclick="setMode('classic')">⚡ 极简分数 (三年级)</button>
  </div>
  
  <!-- 🐻 熊猫模式舞台 (一年级版) -->
  <div class="panda-stage" id="stage-panda">
    <svg class="panda-svg" viewBox="0 0 220 220" id="panda-svg">
      <!-- 身体 -->
      <circle cx="110" cy="180" r="50" fill="#ffffff" stroke="#1e293b" stroke-width="4" />
      <path d="M 75 160 Q 110 145 145 160" fill="none" stroke="#1e293b" stroke-width="4" />
      
      <!-- 耳朵 -->
      <circle cx="65" cy="75" r="22" fill="#1e293b" class="panda-ear panda-ear-left" id="ear-l" />
      <circle cx="65" cy="75" r="12" fill="#334155" class="panda-ear" />
      <circle cx="155" cy="75" r="22" fill="#1e293b" class="panda-ear panda-ear-right" id="ear-r" />
      <circle cx="155" cy="75" r="12" fill="#334155" class="panda-ear" />
      
      <!-- 头部 -->
      <circle cx="110" cy="120" r="48" fill="#ffffff" stroke="#1e293b" stroke-width="4" />
      
      <!-- 眼睛黑圈 -->
      <ellipse cx="88" cy="115" rx="14" ry="18" fill="#1e293b" transform="rotate(-15, 88, 115)" />
      <ellipse cx="132" cy="115" rx="14" ry="18" fill="#1e293b" transform="rotate(15, 132, 115)" />
      
      <!-- 闭眼状态 (闭合弧线) -->
      <g id="eyes-closed" class="panda-eye-sleep">
        <path d="M 80 115 Q 88 122 96 115" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
        <path d="M 124 115 Q 132 122 140 115" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      </g>
      
      <!-- 睁眼状态 -->
      <g id="eyes-open" class="panda-eye-awake">
        <circle cx="88" cy="115" r="6" fill="#ffffff" />
        <circle cx="88" cy="115" r="3" fill="#000000" />
        <circle cx="132" cy="115" r="6" fill="#ffffff" />
        <circle cx="132" cy="115" r="3" fill="#000000" />
        
        <path d="M 88 122 Q 86 132 84 135" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
        <path d="M 132 122 Q 134 132 136 135" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      </g>
      
      <!-- 脸颊粉红 -->
      <ellipse cx="72" cy="130" rx="7" ry="4" fill="#fca5a5" opacity="0.6" />
      <ellipse cx="148" cy="130" rx="7" ry="4" fill="#fca5a5" opacity="0.6" />
      
      <!-- 鼻子与小嘴 -->
      <polygon points="106,128 114,128 110,132" fill="#1e293b" />
      <path d="M 106 135 Q 110 138 114 135" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
      
      <!-- 手臂 (捂耳朵) -->
      <g id="hand-l" class="panda-hand panda-hand-left">
        <rect x="35" y="160" width="30" height="20" rx="10" fill="#1e293b" />
      </g>
      <g id="hand-r" class="panda-hand panda-hand-right">
        <rect x="155" y="160" width="30" height="20" rx="10" fill="#1e293b" />
      </g>
    </svg>
  </div>

  <!-- ⚡ 极简数值舞台 (三年级版) -->
  <div class="classic-stage" id="stage-classic">
    <div class="glowing-ring" id="ring">
      <span class="ring-val" id="ring-pct">0</span>
      <span class="ring-lbl">当前分贝</span>
    </div>
  </div>

  <!-- 动态状态提示横幅 -->
  <div class="status-banner" id="status-txt" style="color: var(--success);">
    😴 挑战准备就绪
  </div>

  <!-- 星星/分数计数器 -->
  <div class="score-bank" id="bank">
    <div class="bank-label" id="bank-lbl">✨ 收集到的星星：</div>
    <div class="bank-value" id="score-text">0</div>
  </div>

  <!-- 噪音度量条 -->
  <div class="noise-container">
    <div class="bar-label">
      <span>🔊 实时声音强度：</span>
      <span id="vol-pct">0%</span>
    </div>
    <div class="noise-meter">
      <div class="noise-fill" id="noise-fill"></div>
    </div>
  </div>

  <!-- 灵敏度调节 -->
  <div class="settings-panel">
    <div class="settings-header">
      <span>🎤 麦克风大小调节</span>
      <span style="color: var(--primary);" id="sensitivity-val">1.5x</span>
    </div>
    <input type="range" id="sensitivity" min="0.5" max="4.0" step="0.1" value="1.5" oninput="changeSensitivity(this.value)">
  </div>

  <!-- 操作按钮 -->
  <div class="action-row">
    <button class="btn btn-play" id="btn-action" onclick="toggle挑战()">▶ 开始挑战</button>
    <button class="btn-reset" onclick="reset挑战()" title="重置分数">🔄</button>
  </div>

  <div class="tip">保持安静累计积分，故意喧哗将被快速扣分！</div>
</div>

<script>
  let currentMode = 'panda'; // 'panda' 或 'classic'
  let isRunning = false;
  let score = 0;
  let sensitivity = 1.5;
  let timeTicker = 0;

  let audioCtx = null;
  let micStream = null;
  let analyser = null;
  let dataArray = null;
  let mainLoop = null;

  // 1. 初始化繁星夜空背景
  const sky = document.getElementById('sky');
  const numStars = 60;
  const starElements = [];

  for (let i = 0; i < numStars; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.width = star.style.height = `${2 + Math.random() * 4}px`;
    star.style.left = `${Math.random() * 100}%`;
    star.style.top = `${Math.random() * 80}%`;
    sky.appendChild(star);
    starElements.push(star);
  }

  // 2. 切换模式
  function setMode(mode) {
    currentMode = mode;
    
    const btnPanda = document.getElementById('btn-mode-panda');
    const btnClassic = document.getElementById('btn-mode-classic');
    const stagePanda = document.getElementById('stage-panda');
    const stageClassic = document.getElementById('stage-classic');
    const bankLbl = document.getElementById('bank-lbl');

    if (mode === 'panda') {
      btnPanda.classList.add('active');
      btnClassic.classList.remove('active');
      stagePanda.style.display = 'flex';
      stageClassic.style.display = 'none';
      bankLbl.innerHTML = '✨ 收集到的星星：';
    } else {
      btnPanda.classList.remove('active');
      btnClassic.classList.add('active');
      stagePanda.style.display = 'none';
      stageClassic.style.display = 'flex';
      bankLbl.innerHTML = '🏆 累计静音得分：';
    }
    
    reset挑战();
  }

  // 3. 授权麦克风
  async function initMicrophone() {
    if (audioCtx) return true;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      micStream = stream;

      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      source.connect(analyser);
      return true;
    } catch (e) {
      alert("无法使用麦克风，请检查并允许麦克风权限！");
      return false;
    }
  }

  function changeSensitivity(val) {
    sensitivity = parseFloat(val);
    document.getElementById('sensitivity-val').textContent = `${sensitivity.toFixed(1)}x`;
  }

  async function toggle挑战() {
    const btn = document.getElementById('btn-action');
    
    if (!isRunning) {
      const active = await initMicrophone();
      if (!active) return;
      
      isRunning = true;
      btn.textContent = "⏸ 暂停挑战";
      btn.className = "btn btn-stop";
      
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      mainLoop = setInterval(updateFrame, 100);
    } else {
      isRunning = false;
      btn.textContent = "▶ 开始挑战";
      btn.className = "btn btn-play";
      clearInterval(mainLoop);
      
      // 熊猫强制入睡
      setPandaState('sleeping');
      resetClassicRing();
    }
  }

  // 4. 核心周期更新 (每100ms)
  function updateFrame() {
    if (!isRunning || !analyser) return;

    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) {
      sum += dataArray[i];
    }
    let rawAvg = sum / dataArray.length;
    
    // 计算 0-100 音量
    let volume = Math.min(100, Math.round(rawAvg * sensitivity));
    
    // 更新音量进度条
    document.getElementById('noise-fill').style.width = `${volume}%`;
    document.getElementById('vol-pct').textContent = `${volume}%`;

    const statusTxt = document.getElementById('status-txt');

    // 5. 音量状态逻辑判断
    if (volume < 15) {
      // 状态：安静/安全
      statusTxt.style.color = "var(--success)";
      
      if (currentMode === 'panda') {
        setPandaState('sleeping');
        statusTxt.textContent = "😴 熊猫宝宝睡得好香甜...";
      } else {
        updateClassicRing('quiet', volume);
        statusTxt.textContent = "🍀 保持极其安静，分数快速上涨！";
      }

      // 静音加分
      let addedPoints = (100 - volume) / 10; // 最大为10
      score += addedPoints * 0.1;
      
      timeTicker++;
      if (currentMode === 'panda') {
        if (timeTicker % 15 === 0) spawnZzz();
        if (timeTicker % 10 === 0) spawnStarFeedback();
      } else {
        if (timeTicker % 10 === 0) spawnStarFeedback();
      }
      if (timeTicker % 10 === 0) glowRandomStar(true);

    } else if (volume < 32) {
      // 状态：警示状态
      statusTxt.style.color = "var(--warning)";
      
      if (currentMode === 'panda') {
        setPandaState('disturbed');
        statusTxt.textContent = "🤫 嘘！熊猫宝宝耳朵在动了...";
      } else {
        updateClassicRing('warning', volume);
        statusTxt.textContent = "⚠️ 注意，教室内有轻微说话声！";
      }

      // 减半加分
      let addedPoints = (100 - volume) / 10;
      score += addedPoints * 0.05;

    } else {
      // 状态：吵闹，扣分！
      statusTxt.style.color = "var(--error)";
      
      if (currentMode === 'panda') {
        setPandaState('awake');
        statusTxt.textContent = "😭 太吵了！星星正在流失！";
      } else {
        updateClassicRing('loud', volume);
        statusTxt.textContent = "🚨 噪音超标！分数快速被扣除！";
      }

      // 扣分扣星 (每100ms扣掉1.5分，相当于每秒扣掉15分)
      score = Math.max(0, score - 1.5);
      
      timeTicker++;
      if (timeTicker % 5 === 0) {
        spawnMinusPointsFeedback();
        glowRandomStar(false); // 熄灭夜空的星星
        playSoftBuzzer();
      }
    }

    // 渲染总分
    document.getElementById('score-text').textContent = Math.round(score);
  }

  // 6. 三年级经典数值模式的圆环发光动作
  function updateClassicRing(status, volume) {
    const ring = document.getElementById('ring');
    const ringPct = document.getElementById('ring-pct');
    
    ringPct.textContent = volume;
    const scale = 1 + (volume / 250);
    ring.style.transform = `scale(${scale})`;

    if (status === 'quiet') {
      ring.style.borderColor = 'var(--success)';
      ring.style.boxShadow = `0 0 ${15 + (15 - volume)}px rgba(16, 185, 129, 0.4), inset 0 0 ${15 + (15 - volume)}px rgba(16, 185, 129, 0.4)`;
    } else if (status === 'warning') {
      ring.style.borderColor = 'var(--warning)';
      ring.style.boxShadow = `0 0 20px rgba(245, 158, 11, 0.3), inset 0 0 20px rgba(245, 158, 11, 0.3)`;
    } else {
      ring.style.borderColor = 'var(--error)';
      ring.style.boxShadow = `0 0 ${20 + volume}px rgba(239, 68, 68, 0.7), inset 0 0 ${20 + volume}px rgba(239, 68, 68, 0.7)`;
    }
  }

  function resetClassicRing() {
    const ring = document.getElementById('ring');
    const ringPct = document.getElementById('ring-pct');
    ringPct.textContent = "0";
    ring.style.transform = "scale(1)";
    ring.style.borderColor = 'var(--success)';
    ring.style.boxShadow = '0 0 20px rgba(16, 185, 129, 0.2), inset 0 0 20px rgba(16, 185, 129, 0.2)';
  }

  // 7. 扣分警告蜂鸣音
  function playSoftBuzzer() {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime); 
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    } catch(e){}
  }

  // 8. 控制熊猫视觉外观
  function setPandaState(state) {
    const ears = [document.getElementById('ear-l'), document.getElementById('ear-r')];
    const handL = document.getElementById('hand-l');
    const handR = document.getElementById('hand-r');
    const eyesSleep = document.getElementById('eyes-closed');
    const eyesAwake = document.getElementById('eyes-open');
    const panda = document.getElementById('panda-svg');

    if (state === 'sleeping') {
      eyesSleep.style.opacity = '1';
      eyesAwake.style.opacity = '0';
      handL.className = 'panda-hand panda-hand-left';
      handR.className = 'panda-hand panda-hand-right';
      ears.forEach(e => e.classList.remove('shake-ears'));
      panda.style.transform = 'scale(1)';
    } else if (state === 'disturbed') {
      eyesSleep.style.opacity = '1';
      eyesAwake.style.opacity = '0';
      handL.className = 'panda-hand panda-hand-left';
      handR.className = 'panda-hand panda-hand-right';
      ears.forEach(e => e.classList.add('shake-ears'));
      panda.style.transform = 'scale(1)';
    } else if (state === 'awake') {
      eyesSleep.style.opacity = '0';
      eyesAwake.style.opacity = '1';
      handL.className = 'panda-hand panda-hand-left cover-ears-left';
      handR.className = 'panda-hand panda-hand-right cover-ears-right';
      ears.forEach(e => e.classList.remove('shake-ears'));
      panda.style.transform = 'scale(0.95)';
    }
  }

  // 9. 漂浮睡眠气泡
  function spawnZzz() {
    const bubble = document.createElement('div');
    bubble.className = 'zzz-bubble';
    bubble.textContent = Math.random() > 0.4 ? 'Z' : 'z';
    
    const stage = document.getElementById('stage-panda');
    const stageRect = stage.getBoundingClientRect();
    
    bubble.style.left = `${stageRect.width / 2 + 10}px`;
    bubble.style.top = `${stageRect.height / 2 + 25}px`;
    
    stage.appendChild(bubble);
    setTimeout(() => { bubble.remove(); }, 3000);
  }

  // 10. 加分星星飘飞
  function spawnStarFeedback() {
    const star = document.createElement('div');
    star.className = 'floating-star-feedback';
    star.textContent = '⭐';
    
    const activeStage = currentMode === 'panda' ? document.getElementById('stage-panda') : document.getElementById('stage-classic');
    const stageRect = activeStage.getBoundingClientRect();
    const bankRect = document.getElementById('bank').getBoundingClientRect();
    
    star.style.left = `${stageRect.width / 2}px`;
    star.style.top = `${stageRect.height / 2}px`;
    
    const tx = bankRect.left - stageRect.left - (stageRect.width / 2) + 20;
    const ty = bankRect.top - stageRect.top - (stageRect.height / 2) + 15;
    
    star.style.setProperty('--tx', `${tx}px`);
    star.style.setProperty('--ty', `${ty}px`);
    
    activeStage.appendChild(star);
    setTimeout(() => { star.remove(); }, 1200);
  }

  // 11. 扣分数值漂浮 (-15)
  function spawnMinusPointsFeedback() {
    const minus = document.createElement('div');
    minus.className = 'minus-points-feedback';
    minus.textContent = '-15';
    
    const activeStage = currentMode === 'panda' ? document.getElementById('stage-panda') : document.getElementById('stage-classic');
    const stageRect = activeStage.getBoundingClientRect();
    
    minus.style.left = `${stageRect.width / 2 - 10}px`;
    minus.style.top = `${stageRect.height / 2 - 45}px`;
    
    activeStage.appendChild(minus);
    setTimeout(() => { minus.remove(); }, 1200);
  }

  // 12. 繁星背景闪烁
  function glowRandomStar(turnOn) {
    const idx = Math.floor(Math.random() * starElements.length);
    const star = starElements[idx];
    if (turnOn) {
      star.classList.add('glow');
    } else {
      const glowingStars = starElements.filter(s => s.classList.contains('glow'));
      if (glowingStars.length > 0) {
        const killIdx = Math.floor(Math.random() * glowingStars.length);
        glowingStars[killIdx].classList.remove('glow');
      }
    }
  }

  function reset挑战() {
    score = 0;
    timeTicker = 0;
    document.getElementById('score-text').textContent = "0";
    document.getElementById('vol-pct').textContent = "0%";
    document.getElementById('noise-fill').style.width = "0%";
    
    document.getElementById('status-txt').textContent = "😴 挑战准备就绪";
    document.getElementById('status-txt').style.color = "var(--success)";
    
    starElements.forEach(s => s.classList.remove('glow'));
    setPandaState('sleeping');
    resetClassicRing();

    if (isRunning) {
      toggle挑战();
    }
  }
</script>
