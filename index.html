<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静音挑战 · 越安静得分越高</title>
  
  <!-- 引入优质字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;900&family=Noto+Sans+SC:wght@500;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.7);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.4);
      --success: #10b981;
      --text: #f1f5f9;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans SC', system-ui, sans-serif;
      background: radial-gradient(circle at center, #111827 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .main-card {
      background: var(--card-bg);
      border: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: 32px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 积分展示 */
    .score-container {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      padding: 20px 40px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .score-label {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .score-value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 4.5rem;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 0 20px var(--primary-glow);
      line-height: 1;
    }

    .points-speed {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--success);
      margin-top: 8px;
      height: 20px;
    }

    /* 发光音量球 */
    .visualizer-container {
      width: 180px;
      height: 180px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .volume-orb {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, #e0f2fe 0%, #0ea5e9 100%);
      box-shadow: 0 0 30px rgba(14, 165, 233, 0.3);
      transition: transform 0.1s ease, filter 0.1s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .volume-value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 2.2rem;
      font-weight: 900;
      color: #0c4a6e;
    }

    .volume-lbl {
      font-size: 0.7rem;
      font-weight: 800;
      color: #0369a1;
      text-transform: uppercase;
    }

    /* 装饰环 */
    .visual-ring {
      position: absolute;
      border: 2px dashed rgba(56, 189, 248, 0.2);
      border-radius: 50%;
      width: 160px;
      height: 160px;
      animation: rotateRing 15s linear infinite;
      z-index: 1;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 灵敏度控制 */
    .control-panel {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      outline: none;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* 操作按钮 */
    .action-group {
      display: flex;
      gap: 15px;
      width: 100%;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: var(--transition);
    }

    .btn-start {
      flex: 1;
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
    }

    .btn-pause {
      flex: 1;
      background: #334155;
      color: white;
    }

    .btn-reset {
      background: transparent;
      border: 1.5px solid #334155;
      color: #94a3b8;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .btn-reset:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    .mic-tip {
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>

<div class="main-card">
  <h1>🤫 课堂静音大挑战</h1>
  
  <!-- 音量状态球 -->
  <div class="visualizer-container">
    <div class="visual-ring"></div>
    <div class="volume-orb" id="orb">
      <span class="volume-value" id="vol-text">0</span>
      <span class="volume-lbl">当前噪音</span>
    </div>
  </div>

  <!-- 分数板块 -->
  <div class="score-container">
    <div class="score-label">累计挑战得分</div>
    <div class="score-value" id="score-text">0</div>
    <div class="points-speed" id="speed-text">保持安静获取积分</div>
  </div>

  <!-- 控制板块 -->
  <div class="control-panel">
    <div class="slider-header">
      <span>🎤 麦克风灵敏度校准</span>
      <span style="color: var(--primary);" id="sensitivity-val">1.5x</span>
    </div>
    <input type="range" id="sensitivity" min="0.5" max="4.0" step="0.1" value="1.5" oninput="changeSensitivity(this.value)">
  </div>

  <!-- 操作按钮 -->
  <div class="action-group">
    <button class="btn btn-start" id="btn-action" onclick="togglePlay()">▶ 开始运行</button>
    <button class="btn-reset" onclick="resetGame()" title="重置分数">🔄</button>
  </div>

  <div class="mic-tip">请在提示时允许使用麦克风权限 · 声音完全本地处理</div>
</div>

<script>
  let isRunning = false;
  let score = 0;
  let sensitivity = 1.5;
  
  let audioCtx = null;
  let micStream = null;
  let analyser = null;
  let dataArray = null;
  let gameInterval = null;

  async function initAudio() {
    if (audioCtx) return true;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      micStream = stream;
      
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      source.connect(analyser);
      return true;
    } catch (err) {
      alert("无法启用麦克风，请检查浏览器权限权限！");
      return false;
    }
  }

  function changeSensitivity(val) {
    sensitivity = parseFloat(val);
    document.getElementById('sensitivity-val').textContent = `${sensitivity.toFixed(1)}x`;
  }

  async function togglePlay() {
    const btn = document.getElementById('btn-action');
    
    if (!isRunning) {
      const active = await initAudio();
      if (!active) return;
      
      isRunning = true;
      btn.textContent = "⏸ 暂停挑战";
      btn.className = "btn btn-pause";
      
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      // 每 100ms 采样一次并更新得分
      gameInterval = setInterval(updateFrame, 100);
    } else {
      isRunning = false;
      btn.textContent = "▶ 开始运行";
      btn.className = "btn btn-start";
      clearInterval(gameInterval);
    }
  }

  function updateFrame() {
    if (!isRunning || !analyser) return;
    
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) {
      sum += dataArray[i];
    }
    let rawAvg = sum / dataArray.length;
    
    // 缩放到 0 - 100 噪音等级
    let volume = Math.min(100, Math.round(rawAvg * sensitivity));
    
    // 越安静加分越多（绝对安静0分贝，秒加10分；极其吵闹100分贝，秒加0分）
    // 每次周期 100ms，所以分值乘以 0.1
    let addedPoints = Math.max(0, (100 - volume) / 10);
    score += addedPoints;
    
    // 渲染 UI 状态
    document.getElementById('vol-text').textContent = volume;
    document.getElementById('score-text').textContent = Math.round(score);
    
    const speedText = document.getElementById('speed-text');
    if (volume < 15) {
      speedText.textContent = `🍀 极度安静！秒加 +10 分`;
      speedText.style.color = "#10b981";
    } else if (volume < 40) {
      speedText.textContent = `👍 较安静中，秒加 +${Math.round((100 - volume)/10)} 分`;
      speedText.style.color = "#34d399";
    } else {
      speedText.textContent = `⚠️ 太吵啦！得分极慢 (秒加 +${Math.round((100 - volume)/10)} 分)`;
      speedText.style.color = "#f87171";
    }

    // 缩放并改变发光球体的发光强度与大小
    const orb = document.getElementById('orb');
    const scale = 1 + (volume / 200); // 噪音大则球体变大
    orb.style.transform = `scale(${scale})`;
    
    if (volume > 40) {
      // 吵闹红光
      orb.style.background = 'radial-gradient(circle, #fecaca 0%, #ef4444 100%)';
      orb.style.boxShadow = `0 0 ${20 + volume}px rgba(239, 68, 68, 0.6)`;
    } else {
      // 安静蓝绿光
      orb.style.background = 'radial-gradient(circle, #e0fdf4 0%, #10b981 100%)';
      orb.style.boxShadow = `0 0 ${20 + (40 - volume)}px rgba(16, 185, 129, 0.4)`;
    }
  }

  function resetGame() {
    score = 0;
    document.getElementById('score-text').textContent = "0";
    document.getElementById('vol-text').textContent = "0";
    document.getElementById('speed-text').textContent = "保持安静获取积分";
    document.getElementById('speed-text').style.color = "#94a3b8";
    
    const orb = document.getElementById('orb');
    orb.style.transform = "scale(1)";
    orb.style.background = 'radial-gradient(circle, #e0f2fe 0%, #0ea5e9 100%)';
    orb.style.boxShadow = "0 0 30px rgba(14, 165, 233, 0.3)";
    
    if (isRunning) {
      togglePlay(); // 暂停
    }
  }
</script>

</body>
</html>
